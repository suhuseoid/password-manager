[package]
name = "brankas"
version = "0.1.0"
description = "Brankas - penyimpan password offline"
edition = "2021"

[lib]
name = "brankas_lib"
path = "src/lib.rs"

[[bin]]
name = "brankas"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
csv = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
arboard = "3"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
rqrr = { version = "0.9", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
